<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Egg Drop Soup</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="stage">
    <div class="game howto">
      <img class="howtocook-bg" src="./howtocook.png" alt="" />

      <a href="cookbook.html" class="back-btn hit" aria-label="Back to cookbook">
        <img src="./arrow_btn.png" alt="Back" />
      </a>

      <div class="howto-content">
        <div class="howto-grid">

          <div class="ingredients">
            <label class="ing-item"><input type="checkbox"> Chicken stock</label>
            <label class="ing-item"><input type="checkbox"> Eggs</label>
            <label class="ing-item"><input type="checkbox"> Sesame oil</label>
            <label class="ing-item"><input type="checkbox"> Salt / white pepper</label>
            <label class="ing-item"><input type="checkbox"> Spring onion</label>
            <label class="ing-item"><input type="checkbox"> Cornstarch (to thicken)</label>
            <label class="ing-item"><input type="checkbox"> Water (for slurry)</label>
          </div>

          <div class="instructions">
            <ol>
              <li>Bring stock to a boil.</li>
              <li>Lower heat.</li>
              <li>Slowly pour beaten eggs while stirring.</li>
              <li>Add cornstarch slurry while stirring to thicken.</li>
              <li>Add sesame oil and seasoning.</li>
              <li>Garnish with spring onion.</li>
            </ol>
          </div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
