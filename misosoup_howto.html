<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miso Soup</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="stage">
    <div class="game howto">
      <img class="howtocook-bg" src="./howtocook.png" alt="" />

      <a href="cookbook.html" class="back-btn hit" aria-label="Back to cookbook">
        <img src="./arrow_btn.png" alt="Back" />
      </a>

      <div class="howto-content">
        <div class="howto-grid">

          <div class="ingredients">
            <label class="ing-item"><input type="checkbox"> Dashi (Japanese soup stock)</label>
            <label class="ing-item"><input type="checkbox"> Miso paste</label>
            <label class="ing-item"><input type="checkbox"> Silken tofu</label>
            <label class="ing-item"><input type="checkbox"> Seaweed</label>
            <label class="ing-item"><input type="checkbox"> Green onions (optional)</label>
            <label class="ing-item"><input type="checkbox"> Water</label>
          </div>

          <div class="instructions">
            <ol>
              <li>Boil dashi with water.</li>
              <li>Turn down heat and add miso paste.</li>
              <li>Add tofu, seaweed, and green onion. Warm through (no need to boil hard).</li>
            </ol>
          </div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
