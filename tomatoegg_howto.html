<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tomato Egg Stir Fry</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="stage">
    <div class="game howto">

      <img class="howtocook-bg" src="./howtocook.png" alt="" />

      <!-- back to cookbook -->
      <a href="cookbook.html" class="back-btn hit" aria-label="Back to cookbook">
        <img src="./arrow_btn.png" alt="Back" />
      </a>

      <div class="howto-content">
        <div class="howto-grid">

          <!-- INGREDIENTS (left) -->
          <div class="ingredients">
            <label class="ing-item"><input type="checkbox"> 2–3 eggs</label>
            <label class="ing-item"><input type="checkbox"> 1/2 tsp salt</label>
            <label class="ing-item"><input type="checkbox"> 1/2 tsp pepper</label>
            <label class="ing-item"><input type="checkbox"> 1 clove minced garlic</label>
            <label class="ing-item"><input type="checkbox"> 2 medium tomatoes, chopped</label>
            <label class="ing-item"><input type="checkbox"> 1 tsp sugar</label>
            <label class="ing-item"><input type="checkbox"> 1 tbsp tomato sauce</label>
            <label class="ing-item"><input type="checkbox"> 1 spring onion</label>
            <label class="ing-item"><input type="checkbox"> Soy sauce (optional)</label>
          </div>

          <!-- INSTRUCTIONS (right) -->
          <div class="instructions">
            <ol>
              <li>Season eggs with salt and pepper, add a small amount of water, then beat.</li>
              <li>Add oil to pan, stir fry garlic (and chili, optional).</li>
              <li>Add tomatoes, add a little water, cook until soft/mushy.</li>
              <li>Add sugar + tomato sauce, stir. Add soy sauce (optional).</li>
              <li>Add spring onion and serve.</li>
            </ol>
          </div>

        </div>
      </div>

    </div>
  </div>
</body>
</html>
