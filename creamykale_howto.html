<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creamy Kale</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="stage">
    <div class="game howto">
      <img class="howtocook-bg" src="./howtocook.png" alt="" />

      <a href="cookbook.html" class="back-btn hit" aria-label="Back to cookbook">
        <img src="./arrow_btn.png" alt="Back" />
      </a>

      <div class="howto-content">
        <div class="howto-grid">

          <div class="ingredients">
            <label class="ing-item"><input type="checkbox"> Fresh kale</label>
            <label class="ing-item"><input type="checkbox"> Olive oil</label>
            <label class="ing-item"><input type="checkbox"> Minced garlic</label>
            <label class="ing-item"><input type="checkbox"> Onion (finely chopped)</label>
            <label class="ing-item"><input type="checkbox"> Heavy cream</label>
            <label class="ing-item"><input type="checkbox"> Cream cheese</label>
          </div>

          <div class="instructions">
            <ol>
              <li>Add oil to pan. Caramelize onion and garlic.</li>
              <li>Add chopped kale and cook until slightly softened.</li>
              <li>Pour heavy cream and lower heat.</li>
              <li>Add cream cheese and cook on very low heat until melted.</li>
            </ol>
          </div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
