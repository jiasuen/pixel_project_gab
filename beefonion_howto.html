<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beef & Onion Stir Fry</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="stage">
    <div class="game howto">
      <img class="howtocook-bg" src="./howtocook.png" alt="" />

      <a href="cookbook.html" class="back-btn hit" aria-label="Back to cookbook">
        <img src="./arrow_btn.png" alt="Back" />
      </a>

      <div class="howto-content">
        <div class="howto-grid">

          <div class="ingredients">
            <label class="ing-item"><input type="checkbox"> Beef slices</label>
            <label class="ing-item"><input type="checkbox"> Onion</label>
            <label class="ing-item"><input type="checkbox"> Garlic</label>
            <label class="ing-item"><input type="checkbox"> Soy sauce</label>
            <label class="ing-item"><input type="checkbox"> Oyster sauce</label>
            <label class="ing-item"><input type="checkbox"> Sugar (pinch)</label>
            <label class="ing-item"><input type="checkbox"> Oil</label>
            <label class="ing-item"><input type="checkbox"> Salt (light seasoning)</label>
          </div>

          <div class="instructions">
            <ol>
              <li>Season beef lightly with salt.</li>
              <li>Heat pan very hot, sear beef quickly. Remove.</li>
              <li>Add oil, onion and garlic. Cook till soft.</li>
              <li>Add beef back. Add soy sauce, oyster sauce, and a pinch of sugar.</li>
              <li>Stir fry briefly and serve with rice.</li>
            </ol>
          </div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
